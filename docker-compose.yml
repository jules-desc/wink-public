services:
  postgres:
    image: postgres:17
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: winkpages
      POSTGRES_PASSWORD: winkpages
      POSTGRES_DB: winkpages
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./prisma/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U winkpages"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
